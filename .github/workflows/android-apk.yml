name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torqscan-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Flutter source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="DzTorqscan_v1.4.0_complete.zip"
          if [ ! -f "$ARCHIVE" ]; then
            ARCHIVE="$(find . -maxdepth 1 -name 'DzTorqscan_source_recovery_*.zip' -print | sort -V | tail -n 1)"
          fi
          if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
            echo "::error::No Dz Torqscan source archive found in repository root."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted
          PUBSPEC="$(find extracted -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "::error::No pubspec.yaml found in source archive; it may not contain a complete Flutter project."
            find extracted -maxdepth 3 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found at: $PROJECT_DIR"

      - name: Normalize Android build plugin versions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=""
          for candidate in android/settings.gradle android/settings.gradle.kts; do
            if [ -f "$candidate" ]; then SETTINGS="$candidate"; break; fi
          done
          if [ -z "$SETTINGS" ]; then
            echo "::error::Android settings.gradle not found."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          suffixes = {'.gradle', '.kts', '.toml', '.properties'}
          version_pattern = re.compile(r'(?<!\d)(\d+)\.(\d+)\.(\d+)(?!\d)')
          updated_files = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix not in suffixes:
                  continue
              if '.git' in path.parts or 'build' in path.parts:
                  continue
              try:
                  lines = path.read_text().splitlines(keepends=True)
              except (UnicodeDecodeError, OSError):
                  continue

              changed = [False]
              for index, line in enumerate(lines):
                  lowered = line.lower()
                  if 'kotlin' in lowered:
                      def upgrade_kotlin(match):
                          version = tuple(int(part) for part in match.groups())
                          if version < (2, 2, 20):
                              changed[0] = True
                              return '2.2.20'
                          return match.group(0)

                      line = version_pattern.sub(upgrade_kotlin, line)

                  if 'com.android' in lowered:
                      upgraded_agp = re.sub(r'(?<!\d)9\.0\.0(?!\d)', '8.11.1', line)
                      if upgraded_agp != line:
                          changed[0] = True
                          line = upgraded_agp

                  lines[index] = line

              if changed[0]:
                  path.write_text(''.join(lines))
                  updated_files.append(str(path))

          stale = []
          for path in Path('android').rglob('*'):
              if not path.is_file() or path.suffix not in suffixes:
                  continue
              for line_no, line in enumerate(path.read_text(errors='ignore').splitlines(), 1):
                  lowered = line.lower()
                  if 'kotlin' in lowered:
                      for match in version_pattern.finditer(line):
                          version = tuple(int(part) for part in match.groups())
                          if version < (2, 2, 20):
                              stale.append((str(path), line_no, line.strip(), f'Kotlin {match.group(0)}'))
                  if 'com.android' in lowered and re.search(r'(?<!\d)9\.0\.0(?!\d)', line):
                      stale.append((str(path), line_no, line.strip(), 'Android Gradle Plugin 9.0.0'))

          if stale:
              for path, line_no, line, reason in stale:
                  print(f'{path}:{line_no}: {reason}: {line}')
              raise SystemExit('::error::An outdated Android/Kotlin plugin version remains in Gradle configuration.')

          print('Android Gradle Plugin floor and Kotlin plugin version floor verified.')
          if updated_files:
              print('Normalized build declarations in: ' + ', '.join(updated_files))
          else:
              print('No Android/Kotlin plugin declaration needed upgrading.')
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$WRAPPER" ]; then
            echo "::warning::Gradle wrapper properties are missing; creating a compatible distribution configuration."
            mkdir -p "$(dirname "$WRAPPER")"
            cat > "$WRAPPER" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          else
            sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.14.3-\1.zip#' "$WRAPPER"
          fi
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::warning::Gradle launcher or wrapper JAR is missing; creating a bounded Gradle 8.14.3 launcher."
            cat > android/gradlew <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          GRADLE_VERSION=8.14.3
          GRADLE_HOME="$HOME/.gradle/manual/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            mkdir -p "$(dirname "$GRADLE_HOME")"
            TMP_ZIP="$(mktemp)"
            URL="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
            if ! curl -fL --connect-timeout 20 --max-time 240 --retry 2 --retry-all-errors "$URL" -o "$TMP_ZIP"; then
              rm -f "$TMP_ZIP"
              TMP_ZIP="$(mktemp)"
              URL="https://downloads.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
              curl -fL --connect-timeout 20 --max-time 240 --retry 2 --retry-all-errors "$URL" -o "$TMP_ZIP"
            fi
            unzip -q "$TMP_ZIP" -d "$(dirname "$GRADLE_HOME")"
            rm -f "$TMP_ZIP"
          fi
          exec "$GRADLE_HOME/bin/gradle" "$@"
          SH
          fi
          chmod +x android/gradlew
          echo "Gradle wrapper configuration:"
          cat "$WRAPPER"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache manual Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/manual
          key: gradle-manual-8.14.3-${{ runner.os }}

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Run automated tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "::warning::No Dart automated tests found. Hardware validation is still required."
          fi

      - name: Build installable Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --no-pub --verbose

      - name: Verify APK output
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload Android APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torqscan-dz-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
