name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - 'DzTorqscan_v1.4.0_complete.zip'
      - 'DzTorqscan_source_recovery_*.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torqscan-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        shell: bash
        run: |
          set -euo pipefail
          archive='DzTorqscan_v1.4.0_complete.zip'
          if [ ! -f "$archive" ]; then
            archive="$(find . -maxdepth 1 -type f -name 'DzTorqscan_source_recovery_*.zip' -print | sort -V | tail -n 1)"
          fi
          if [ -z "$archive" ] || [ ! -f "$archive" ]; then
            echo '::error::No TorqScan source archive found.'
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$archive" -d extracted
          pubspec="$(find extracted -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          if [ -z "$pubspec" ]; then
            echo '::error::No pubspec.yaml found in the source archive.'
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi
          project_dir="$(dirname "$pubspec")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Using Flutter project: $project_dir"

      - name: Normalize Android Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -d android
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path('android')
          suffixes = {'.gradle', '.kts', '.toml', '.properties'}
          kotlin_plugin = re.compile(r"""(org\.jetbrains\.kotlin[^\n]*?version\s*['"])(\d+\.\d+\.\d+)(['"])""", re.I)
          kotlin_property = re.compile(r"""(?im)(kotlin[_\.-]?version\s*=\s*['"]?)(\d+\.\d+\.\d+)(['"]?)""")
          kotlin_catalog = re.compile(r"""(?im)^(\s*kotlin[\w.-]*\s*=\s*['"])(\d+\.\d+\.\d+)(['"])""")
          kotlin_classpath = re.compile(r"""(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)(\d+\.\d+\.\d+)""", re.I)
          agp_plugin = re.compile(r"""(com\.android\.application[^\n]*?version\s*['"]|com\.android\.tools\.build:gradle:)(\d+\.\d+\.\d+)""", re.I)
          agp_catalog = re.compile(r"""(?im)^(\s*(?:agp|androidGradlePlugin|android_gradle_plugin)\s*=\s*['"])(\d+\.\d+\.\d+)(['"])""")

          def bump_kotlin(match):
              version = tuple(int(part) for part in match.group(2).split('.'))
              return f"{match.group(1)}2.2.20{match.group(3)}" if version < (2, 2, 20) else match.group(0)

          def pin_agp(match):
              major = int(match.group(2).split('.')[0])
              return f"{match.group(1)}8.11.1" if major >= 9 else match.group(0)

          changed = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.suffix not in suffixes:
                  continue
              try:
                  original = path.read_text()
              except (OSError, UnicodeDecodeError):
                  continue
              updated = kotlin_plugin.sub(bump_kotlin, original)
              updated = kotlin_property.sub(bump_kotlin, updated)
              updated = kotlin_catalog.sub(bump_kotlin, updated)
              updated = kotlin_classpath.sub(lambda m: f"{m.group(1)}2.2.20", updated)
              updated = agp_plugin.sub(pin_agp, updated)
              updated = agp_catalog.sub(
                  lambda m: f"{m.group(1)}8.11.1{m.group(3)}"
                  if int(m.group(2).split('.')[0]) >= 9 else m.group(0),
                  updated,
              )
              if updated != original:
                  path.write_text(updated)
                  changed.append(str(path))

          settings_file = root / 'settings.gradle'
          if not settings_file.exists():
              raise RuntimeError('Android settings.gradle is missing.')
          settings_text = settings_file.read_text()
          if 'org.jetbrains.kotlin.android' not in settings_text:
              settings_lines = settings_text.splitlines()
              marker_index = next(
                  (i for i, line in enumerate(settings_lines) if 'com.android.application' in line and 'version' in line),
                  None,
              )
              if marker_index is None:
                  raise RuntimeError('Cannot add Kotlin plugin: Android application plugin declaration not found.')
              settings_lines.insert(marker_index + 1, '    id "org.jetbrains.kotlin.android" version "2.2.20" apply false')
              settings_text = '\n'.join(settings_lines) + '\n'
              settings_file.write_text(settings_text)
              changed.append(str(settings_file))

          app_build_file = root / 'app' / 'build.gradle'
          if not app_build_file.exists():
              raise RuntimeError('Android app/build.gradle is missing.')
          app_text = app_build_file.read_text()
          if 'org.jetbrains.kotlin.android' not in app_text:
              app_lines = app_text.splitlines()
              app_marker = next(
                  (i for i, line in enumerate(app_lines) if 'com.android.application' in line),
                  None,
              )
              if app_marker is None:
                  raise RuntimeError('Cannot add Kotlin plugin to app module: Android application plugin declaration not found.')
              app_lines.insert(app_marker + 1, '    id "org.jetbrains.kotlin.android"')
              app_text = '\n'.join(app_lines) + '\n'
              app_build_file.write_text(app_text)
              changed.append(str(app_build_file))

          gradle_properties = root / 'gradle.properties'
          if not gradle_properties.exists():
              gradle_properties.write_text('')
          properties_text = gradle_properties.read_text()
          properties_text = re.sub(
              r'(?im)^\s*android\.builtInKotlin\s*=\s*true\s*$',
              'android.builtInKotlin=false',
              properties_text,
          )
          if 'android.builtInKotlin=' not in properties_text:
              properties_text += '\nandroid.builtInKotlin=false\n'
          if 'android.newDsl=false' not in properties_text:
              properties_text += '\nandroid.newDsl=false\n'
          gradle_properties.write_text(properties_text)

          # Resolve the verified app-vs-plugin android:theme manifest conflict.
          manifest_file = root / 'app' / 'src' / 'main' / 'AndroidManifest.xml'
          if not manifest_file.is_file():
              raise RuntimeError('Android app/src/main/AndroidManifest.xml is missing.')
          manifest_text = manifest_file.read_text()
          manifest_open = re.search(r'<manifest\b[^>]*>', manifest_text, re.S)
          if manifest_open is None:
              raise RuntimeError('Android manifest root element is missing.')
          manifest_tag = manifest_open.group(0)
          if not re.search(r'\bxmlns:tools\s*=', manifest_tag):
              updated_manifest_tag = manifest_tag[:-1] + ' xmlns:tools="http://schemas.android.com/tools">'
              manifest_text = manifest_text[:manifest_open.start()] + updated_manifest_tag + manifest_text[manifest_open.end():]
          app_match = re.search(r'<application\b[^>]*>', manifest_text, re.S)
          if app_match is None:
              raise RuntimeError('Android application element is missing.')
          app_tag = app_match.group(0)
          if not re.search(r'\bandroid:theme\s*=', app_tag):
              raise RuntimeError('Expected LaunchTheme android:theme declaration was not found.')
          replace_match = re.search(r"""\btools:replace\s*=\s*["']([^"']*)["']""", app_tag)
          if replace_match:
              replace_values = [value.strip() for value in replace_match.group(1).split(',') if value.strip()]
              if 'android:theme' not in replace_values:
                  replace_values.append('android:theme')
              replacement = 'tools:replace="' + ','.join(replace_values) + '"'
              app_tag = app_tag[:replace_match.start()] + replacement + app_tag[replace_match.end():]
          else:
              app_tag = app_tag[:-1] + ' tools:replace="android:theme">'
          manifest_text = manifest_text[:app_match.start()] + app_tag + manifest_text[app_match.end():]
          manifest_file.write_text(manifest_text)
          ET.parse(manifest_file)
          print('Applied manifest merge override: tools:replace="android:theme"')

          settings_text = settings_file.read_text()
          app_text = app_build_file.read_text()
          if 'org.jetbrains.kotlin.android' not in settings_text or 'version "2.2.20"' not in settings_text:
              raise RuntimeError('Explicit Kotlin Android plugin 2.2.20 was not configured in settings.gradle.')
          if 'org.jetbrains.kotlin.android' not in app_text:
              raise RuntimeError('Kotlin Android plugin was not applied to the app module.')
          print('Updated Gradle declarations:', ', '.join(changed) if changed else 'none')
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.suffix in suffixes:
                  for number, line in enumerate(path.read_text(errors='ignore').splitlines(), 1):
                      if any(token in line.lower() for token in ('kotlin', 'com.android', 'agp =')):
                          print(f'{path}:{number}: {line.strip()}')
          PY
          wrapper='android/gradle/wrapper/gradle-wrapper.properties'
          mkdir -p android/gradle/wrapper
          if [ -f "$wrapper" ]; then
            sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.14.3-\1.zip#' "$wrapper"
          else
            cat > "$wrapper" <<'PROPERTIES'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPERTIES
          fi
          touch android/gradle.properties
          grep -q '^android.newDsl=false$' android/gradle.properties || printf '\nandroid.newDsl=false\n' >> android/gradle.properties
          if [ ! -x android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            cat > android/gradlew <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          GRADLE_VERSION=8.14.3
          GRADLE_HOME="$HOME/.gradle/manual/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            mkdir -p "$(dirname "$GRADLE_HOME")"
            TMP_ZIP="$(mktemp)"
            URL="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
            if ! curl -fL --connect-timeout 20 --max-time 240 --retry 2 --retry-all-errors "$URL" -o "$TMP_ZIP"; then
              rm -f "$TMP_ZIP"
              TMP_ZIP="$(mktemp)"
              URL="https://downloads.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
              curl -fL --connect-timeout 20 --max-time 240 --retry 2 --retry-all-errors "$URL" -o "$TMP_ZIP"
            fi
            unzip -q "$TMP_ZIP" -d "$(dirname "$GRADLE_HOME")"
            rm -f "$TMP_ZIP"
          fi
          exec "$GRADLE_HOME/bin/gradle" "$@"
          SH
          fi
          chmod +x android/gradlew
          cat "$wrapper"

      - name: Install Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Apply audited Dart source fixes
        run: python3 "$GITHUB_WORKSPACE/ci/patch_torqscan.py" "$PROJECT_DIR"

      - name: Analyze Dart
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Install deterministic Dart unit tests
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^name: torqscan        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo '::warning::No Dart test files found; hardware validation remains required.'
          fi

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --no-pub --verbose

      - name: Sign APK for direct device testing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root/build-tools" ]]; then
            echo "::error::Android SDK build-tools directory was not found."
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner was not found in the installed Android build-tools."
            exit 1
          fi
          keystore="$RUNNER_TEMP/torqscan-test.keystore"
          password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -keystore "$keystore" -storepass "$password" -alias torqscan-test -keypass "$password" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=TorqScan Test,O=Ascameleon,C=US"
          "$apksigner" sign --ks "$keystore" --ks-key-alias torqscan-test --ks-pass "pass:$password" --key-pass "pass:$password" --out "$apk.signed" "$apk"
          mv "$apk.signed" "$apk"
          "$apksigner" verify --verbose --print-certs "$apk"
          rm -f "$keystore"

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          "$apksigner" verify --verbose "$apk"
          unzip -t "$apk" >/dev/null
          sha256sum "$apk"
          ls -lh "$apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: torqscan-dz-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
 "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/services/obd_protocol.dart"
          test -f "$PROJECT_DIR/lib/services/connection_endpoint.dart"
          mkdir -p "$PROJECT_DIR/test"
          install -m 0644 "$GITHUB_WORKSPACE/ci/torqscan_tests/obd_protocol_test.dart" "$PROJECT_DIR/test/obd_protocol_test.dart"
          install -m 0644 "$GITHUB_WORKSPACE/ci/torqscan_tests/connection_endpoint_test.dart" "$PROJECT_DIR/test/connection_endpoint_test.dart"
          find "$PROJECT_DIR/test" -maxdepth 1 -type f -name '*_test.dart' -print

      - name: Run Dart tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo '::warning::No Dart test files found; hardware validation remains required.'
          fi

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --no-pub --verbose

      - name: Sign APK for direct device testing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root/build-tools" ]]; then
            echo "::error::Android SDK build-tools directory was not found."
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner was not found in the installed Android build-tools."
            exit 1
          fi
          keystore="$RUNNER_TEMP/torqscan-test.keystore"
          password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -keystore "$keystore" -storepass "$password" -alias torqscan-test -keypass "$password" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=TorqScan Test,O=Ascameleon,C=US"
          "$apksigner" sign --ks "$keystore" --ks-key-alias torqscan-test --ks-pass "pass:$password" --key-pass "pass:$password" --out "$apk.signed" "$apk"
          mv "$apk.signed" "$apk"
          "$apksigner" verify --verbose --print-certs "$apk"
          rm -f "$keystore"

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          "$apksigner" verify --verbose "$apk"
          unzip -t "$apk" >/dev/null
          sha256sum "$apk"
          ls -lh "$apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: torqscan-dz-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
