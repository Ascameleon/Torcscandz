name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torqscan-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Flutter source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="DzTorqscan_v1.4.0_complete.zip"
          if [ ! -f "$ARCHIVE" ]; then
            ARCHIVE="$(find . -maxdepth 1 -name 'DzTorqscan_source_recovery_*.zip' -print | sort -V | tail -n 1)"
          fi
          if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
            echo "::error::No Dz Torqscan source archive found in repository root."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted
          PUBSPEC="$(find extracted -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "::error::No pubspec.yaml found in source archive; it may not contain a complete Flutter project."
            find extracted -maxdepth 3 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found at: $PROJECT_DIR"

      - name: Normalize Android build plugin versions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=""
          for candidate in android/settings.gradle android/settings.gradle.kts; do
            if [ -f "$candidate" ]; then SETTINGS="$candidate"; break; fi
          done
          if [ -z "$SETTINGS" ]; then
            echo "::error::Android settings.gradle not found."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          suffixes = {'.gradle', '.kts', '.toml', '.properties'}
          version_pattern = re.compile(r'(?<!\d)(\d+)\.(\d+)\.(\d+)(?!\d)')
          agp_key = re.compile(r'(?im)^\s*(?:agp|android[_-]?gradle[_-]?plugin(?:[_-]?version)?)\s*=')
          search_roots = (Path('.'), Path('..'))
          paths = set()
          for root in search_roots:
              paths.update(path for path in root.rglob('*') if path.is_file() and path.suffix in suffixes)

          updated_files = []
          for path in sorted(paths):
              if any(part in {'.git', 'build', '.dart_tool'} for part in path.parts):
                  continue
              try:
                  original = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue

              updated = original
              lowered = updated.lower()

              # Normalize every Kotlin plugin declaration and version-catalog key to Flutter's minimum.
              def bump_kotlin(match):
                  version = tuple(int(part) for part in match.group(2).split('.'))
                  return f"{match.group(1)}2.2.20{match.group(3)}" if version < (2, 2, 20) else match.group(0)

              if 'org.jetbrains.kotlin' in lowered:
                  updated = re.sub(
                      r'(?i)(org\.jetbrains\.kotlin[^\n]*?version\s*["\'])(\d+\.\d+\.\d+)(["\'])',
                      bump_kotlin,
                      updated,
                  )

              if 'kotlin_version' in lowered:
                  updated = re.sub(
                      r'(?im)(kotlin_version\s*=\s*["\']?)(\d+\.\d+\.\d+)(["\']?)',
                      bump_kotlin,
                      updated,
                  )

              # Also catch version-catalog aliases such as kotlin, kotlinVersion, or kotlin-android.
              updated = re.sub(
                  r'(?im)^([\s\w.-]*kotlin[\w.-]*\s*=\s*["\'])(\d+\.\d+\.\d+)(["\'])',
                  bump_kotlin,
                  updated,
              )

              # Pin any AGP 9+ declaration to 8.11.1, paired with Gradle 8.14.3.
              def pin_agp(match):
                  version = match.group(2)
                  return f"{match.group(1)}8.11.1" if int(version.split(".")[0]) >= 9 else match.group(0)

              if 'com.android' in lowered:
                  updated = re.sub(
                      r'(?i)(com\.android\.application[^\n]*?version\s*["\']|com\.android\.tools\.build:gradle:)(\d+\.\d+\.\d+)',
                      pin_agp,
                      updated,
                  )
              if agp_key.search(updated):
                  updated = re.sub(
                      r'(?im)^(\s*(?:agp|android[_-]?gradle[_-]?plugin(?:[_-]?version)?)\s*=\s*["\'])(\d+\.\d+\.\d+)(["\'])',
                      lambda match: f"{match.group(1)}8.11.1{match.group(3)}" if int(match.group(2).split(".")[0]) >= 9 else match.group(0),
                      updated,
                  )

              if updated != original:
                  path.write_text(updated)
                  updated_files.append(str(path))

          stale = []
          for path in sorted(paths):
              if any(part in {'.git', 'build', '.dart_tool'} for part in path.parts):
                  continue
              try:
                  text = path.read_text(errors='ignore')
              except OSError:
                  continue
              lowered = text.lower()

              if ('org.jetbrains.kotlin' in lowered or 'kotlin_version' in lowered
                      or re.search(r'(?im)^\s*[\w.-]*kotlin[\w.-]*\s*=', text)):
                  for match in version_pattern.finditer(text):
                      version = tuple(int(part) for part in match.groups())
                      if version < (2, 2, 20):
                          stale.append((str(path), 'Kotlin', match.group(0)))

              if 'com.android' in lowered or agp_key.search(text):
                  agp_versions = re.findall(
                      r'(?im)(?:com\.android\.application[^\n]*?version\s*["\']|com\.android\.tools\.build:gradle:|(?:^\s*(?:agp|android[_-]?gradle[_-]?plugin(?:[_-]?version)?)\s*=\s*["\']))(\d+\.\d+\.\d+)',
                      text,
                  )
                  for agp_version in agp_versions:
                      if int(agp_version.split('.')[0]) >= 9:
                          stale.append((str(path), 'Android Gradle Plugin', agp_version))

          if stale:
              for path, kind, version in stale:
                  print(f'{path}: outdated {kind} version {version}')
              raise SystemExit('::error::An outdated Android/Kotlin plugin version remains in Gradle configuration.')

          print('Android Gradle Plugin and Kotlin plugin version floors verified.')
          if updated_files:
              print('Normalized build declarations in: ' + ', '.join(updated_files))
          else:
              print('No Android/Kotlin plugin declaration needed upgrading.')

          for path in sorted(paths):
              if path.name in {'settings.gradle', 'settings.gradle.kts', 'build.gradle', 'build.gradle.kts', 'libs.versions.toml'}:
                  for line_no, line in enumerate(path.read_text(errors='ignore').splitlines(), 1):
                      if any(token in line.lower() for token in ('kotlin', 'com.android', 'agp =')):
                          print(f'{path}:{line_no}: {line.strip()}')
          PY
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$WRAPPER" ]; then
            echo "::warning::Gradle wrapper properties are missing; creating a compatible distribution configuration."
            mkdir -p "$(dirname "$WRAPPER")"
            cat > "$WRAPPER" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          else
            sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.14.3-\1.zip#' "$WRAPPER"
          fi
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::warning::Gradle launcher or wrapper JAR is missing; creating a bounded Gradle 8.14.3 launcher."
            cat > android/gradlew <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          GRADLE_VERSION=8.14.3
          GRADLE_HOME="$HOME/.gradle/manual/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            mkdir -p "$(dirname "$GRADLE_HOME")"
            TMP_ZIP="$(mktemp)"
            URL="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
            if ! curl -fL --connect-timeout 20 --max-time 240 --retry 2 --retry-all-errors "$URL" -o "$TMP_ZIP"; then
              rm -f "$TMP_ZIP"
              TMP_ZIP="$(mktemp)"
              URL="https://downloads.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
              curl -fL --connect-timeout 20 --max-time 240 --retry 2 --retry-all-errors "$URL" -o "$TMP_ZIP"
            fi
            unzip -q "$TMP_ZIP" -d "$(dirname "$GRADLE_HOME")"
            rm -f "$TMP_ZIP"
          fi
          exec "$GRADLE_HOME/bin/gradle" "$@"
          SH
          fi
          chmod +x android/gradlew
          echo "Gradle wrapper configuration:"
          cat "$WRAPPER"
          # Flutter's Gradle plugin currently requires the legacy Android DSL.
          GRADLE_PROPERTIES="android/gradle.properties"
          touch "$GRADLE_PROPERTIES"
          if grep -qE '^[[:space:]]*android\.newDsl=' "$GRADLE_PROPERTIES"; then
            sed -i -E 's/^[[:space:]]*android\.newDsl=.*/android.newDsl=false/' "$GRADLE_PROPERTIES"
          else
            printf '\nandroid.newDsl=false\n' >> "$GRADLE_PROPERTIES"
          fi
          grep -q '^android.newDsl=false$' "$GRADLE_PROPERTIES"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache manual Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/manual
          key: gradle-manual-8.14.3-${{ runner.os }}

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Run automated tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "::warning::No Dart automated tests found. Hardware validation is still required."
          fi

      - name: Build installable Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --no-pub --verbose

      - name: Verify APK output
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload Android APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torqscan-dz-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
