name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - 'DzTorqscan_v1.4.0_complete.zip'
      - 'DzTorqscan_source_recovery_*.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torqscan-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        shell: bash
        run: |
          set -euo pipefail
          archive='DzTorqscan_v1.4.0_complete.zip'
          if [ ! -f "$archive" ]; then
            archive="$(find . -maxdepth 1 -type f -name 'DzTorqscan_source_recovery_*.zip' -print | sort -V | tail -n 1)"
          fi
          if [ -z "$archive" ] || [ ! -f "$archive" ]; then
            echo '::error::No TorqScan source archive found.'
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$archive" -d extracted
          pubspec="$(find extracted -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          if [ -z "$pubspec" ]; then
            echo '::error::No pubspec.yaml found in the source archive.'
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi
          project_dir="$(dirname "$pubspec")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Using Flutter project: $project_dir"

      - name: Normalize Android Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -d android
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('android')
          suffixes = {'.gradle', '.kts', '.toml', '.properties'}
          kotlin_plugin = re.compile(r"""(org\.jetbrains\.kotlin[^\n]*?version\s*['"])(\d+\.\d+\.\d+)(['"])""", re.I)
          kotlin_property = re.compile(r"""(?im)(kotlin_version\s*=\s*['"]?)(\d+\.\d+\.\d+)(['"]?)""")
          kotlin_catalog = re.compile(r"""(?im)^(\s*kotlin[\w.-]*\s*=\s*['"])(\d+\.\d+\.\d+)(['"])""")
          agp_plugin = re.compile(r"""(com\.android\.application[^\n]*?version\s*['"]|com\.android\.tools\.build:gradle:)(\d+\.\d+\.\d+)""", re.I)
          agp_catalog = re.compile(r"""(?im)^(\s*(?:agp|androidGradlePlugin|android_gradle_plugin)\s*=\s*['"])(\d+\.\d+\.\d+)(['"])""")

          def bump_kotlin(match):
              version = tuple(int(part) for part in match.group(2).split('.'))
              return f"{match.group(1)}2.2.20{match.group(3)}" if version < (2, 2, 20) else match.group(0)

          def pin_agp(match):
              major = int(match.group(2).split('.')[0])
              return f"{match.group(1)}8.11.1" if major >= 9 else match.group(0)

          changed = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.suffix not in suffixes:
                  continue
              try:
                  original = path.read_text()
              except (OSError, UnicodeDecodeError):
                  continue
              updated = kotlin_plugin.sub(bump_kotlin, original)
              updated = kotlin_property.sub(bump_kotlin, updated)
              updated = kotlin_catalog.sub(bump_kotlin, updated)
              updated = agp_plugin.sub(pin_agp, updated)
              updated = agp_catalog.sub(
                  lambda m: f"{m.group(1)}8.11.1{m.group(3)}"
                  if int(m.group(2).split('.')[0]) >= 9 else m.group(0),
                  updated,
              )
              if updated != original:
                  path.write_text(updated)
                  changed.append(str(path))

          print('Updated Gradle declarations:', ', '.join(changed) if changed else 'none')
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name in {'settings.gradle', 'settings.gradle.kts', 'build.gradle', 'build.gradle.kts', 'libs.versions.toml'}:
                  for number, line in enumerate(path.read_text(errors='ignore').splitlines(), 1):
                      if any(token in line.lower() for token in ('kotlin', 'com.android', 'agp =')):
                          print(f'{path}:{number}: {line.strip()}')
          PY
          wrapper='android/gradle/wrapper/gradle-wrapper.properties'
          mkdir -p android/gradle/wrapper
          if [ -f "$wrapper" ]; then
            sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.14.3-\1.zip#' "$wrapper"
          else
            cat > "$wrapper" <<'PROPERTIES'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPERTIES
          fi
          touch android/gradle.properties
          grep -q '^android.newDsl=false$' android/gradle.properties || printf '\nandroid.newDsl=false\n' >> android/gradle.properties
          if [ ! -x android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            cat > android/gradlew <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          GRADLE_VERSION=8.14.3
          GRADLE_HOME="$HOME/.gradle/manual/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            mkdir -p "$(dirname "$GRADLE_HOME")"
            TMP_ZIP="$(mktemp)"
            URL="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
            if ! curl -fL --connect-timeout 20 --max-time 240 --retry 2 --retry-all-errors "$URL" -o "$TMP_ZIP"; then
              rm -f "$TMP_ZIP"
              TMP_ZIP="$(mktemp)"
              URL="https://downloads.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
              curl -fL --connect-timeout 20 --max-time 240 --retry 2 --retry-all-errors "$URL" -o "$TMP_ZIP"
            fi
            unzip -q "$TMP_ZIP" -d "$(dirname "$GRADLE_HOME")"
            rm -f "$TMP_ZIP"
          fi
          exec "$GRADLE_HOME/bin/gradle" "$@"
          SH
          fi
          chmod +x android/gradlew
          cat "$wrapper"

      - name: Install Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Print Dart error contexts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'lib/screens/home_screen.dart:150:175' \
            'lib/screens/vehicle_info_screen.dart:1:18' \
            'lib/services/bluetooth_service.dart:1:260' \
            'lib/services/bluetooth_service.dart:145:190'
          do
            file="$(printf '%s' "$spec" | cut -d: -f1)"
            start="$(printf '%s' "$spec" | cut -d: -f2)"
            end="$(printf '%s' "$spec" | cut -d: -f3)"
            echo "---- $file:$start-$end ----"
            awk -v s="$start" -v e="$end" 'NR >= s && NR <= e { printf "%5d %s\n", NR, $0 }' "$file"
          done

      - name: Analyze Dart
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Dart tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo '::warning::No Dart test files found; hardware validation remains required.'
          fi

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --no-pub --verbose

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$apk"
          sha256sum "$apk"
          ls -lh "$apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: torqscan-dz-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
